name = "kuru-telemetry"
main = "src/index.js"
compatibility_date = "2026-11-03"
compatibility_flags = ["nodejs_compat"]

[triggers]
crons = ["17 3 * * *"]
workers_dev = false

[[routes]]
pattern = "kuru-kuru.ru/api/telemetry/*"
zone_name = "kuru-kuru.ru"

[[d1_databases]]
binding = "kuru-kuru"
database_name = "kuru-telemetry"
database_id = "f1efe8bd-7871-42a7-8792-8ef9de768089"
